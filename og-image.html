<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share picture, 1200x630: job-jagger</title>
<!--
  Source layout for og.png. Render at exactly 1200x630:

    google-chrome-stable --headless --disable-gpu --no-sandbox \
      --window-size=1200,630 --hide-scrollbars --virtual-time-budget=8000 \
      --screenshot=og.png "file:///abs/path/og-image.html"

  The colours are hardcoded on purpose: a share picture must not follow the
  viewer's colour scheme. The font loads from Google Fonts at render time only.
  The numbers are the ones the page itself shows in its stats bar.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
  :root {
    --bg: #0a0e1a;
    --ice: #7ec8e3;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: "Inter", sans-serif;
    color: var(--white);
    background: var(--bg);
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 0 84px;
    background:
      radial-gradient(circle 560px at 50% 18%, rgba(42, 90, 138, 0.5), transparent 70%),
      linear-gradient(180deg, transparent 60%, rgba(126, 200, 227, 0.06));
  }

  .top {
    position: absolute;
    left: 84px;
    right: 84px;
    top: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mark { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .mark svg { width: 40px; height: 40px; }
  .by { font-size: 20px; font-weight: 500; letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.5); }

  .badge {
    position: absolute;
    left: 84px;
    top: 150px;
    padding: 9px 20px;
    border: 1px solid rgba(126, 200, 227, 0.35);
    border-radius: 24px;
    background: rgba(126, 200, 227, 0.1);
    color: var(--ice);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  h1 {
    position: absolute;
    left: 84px;
    top: 208px;
    margin: 0;
    font-size: 100px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  h1 .dim { color: rgba(255, 255, 255, 0.42); }
  h1 .accent { color: var(--ice); }

  .stats {
    position: absolute;
    left: 84px;
    right: 84px;
    bottom: 50px;
    display: flex;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding-top: 28px;
  }
  .stat { flex: 1; padding-right: 24px; }
  .stat + .stat { padding-left: 40px; border-left: 1px solid rgba(255, 255, 255, 0.12); }
  .num {
    font-size: 66px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .gold  { background-image: linear-gradient(135deg, #ffe566, #ffd700, #c9921a); }
  .green { background-image: linear-gradient(135deg, #86efac, #4ade80, #16a34a); }
  .ice   { background-image: linear-gradient(135deg, #bfe6f3, #7ec8e3, #2a5a8a); }
  .label {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <defs>
            <radialGradient id="g" cx="42%" cy="28%" r="62%">
              <stop offset="0%" stop-color="#FFFBCC"/>
              <stop offset="22%" stop-color="#FFD700"/>
              <stop offset="62%" stop-color="#E0A500"/>
              <stop offset="100%" stop-color="#8A5A00"/>
            </radialGradient>
          </defs>
          <polygon points="40,5 48.5,29 74,29 53.5,44.5 61.5,69 40,54 18.5,69 26.5,44.5 6,29 31.5,29" fill="url(#g)"/>
        </svg>
        job-jagger
      </div>
      <div class="by">Babak Bandpey &middot; job-jagger.cocode.dk</div>
    </div>
    <div class="badge">AI-powered job search toolkit for Claude Code</div>
    <h1><span class="dim">From invisible</span><br><span class="accent">to interview-ready</span></h1>
    <div class="stats">
      <div class="stat"><div class="num gold">60+</div><div class="label">Real applications built</div></div>
      <div class="stat"><div class="num green">3</div><div class="label">Interviews: week 1</div></div>
      <div class="stat"><div class="num ice">~30m</div><div class="label">Per application</div></div>
    </div>
  </div>
</body>
</html>
